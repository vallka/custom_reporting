<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$name}</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.24"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        .h1, h1 {
            font-size: 16px;
            font-weight: 700;
            margin-left: 3px;
        }
        .table {
            width: fit-content;
        }
        .table {
            display: block;
            max-height: 80vh;
            overflow: auto;
        }
        .table thead th {
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 3;
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.25);
        }
        .table thead tr:first-child th {
            top: 0;
        }
        .table thead tr:nth-child(2) th {
            top: 36px; /* adjust as needed */
        }
    </style>
</head>
<body>

<div id="app">
    <!-- added count of filtered rows here -->
    <h1>{$name} ({{ filteredAndSortedRows.length }})</h1>

    <table v-if="rows.length" class="table table-striped table-hover table-bordered table-sm">
        <thead>
            <!-- Filter row -->
            <tr>
                <th v-for="(value, key) in rows[0]" :key="'filter-' + key">
                    <input
                        type="text"
                        class="form-control form-control-sm"
                        v-model="filters[key]"
                        @keydown.stop
                        :placeholder="'Filter ' + key"
                    >
                </th>
            </tr>

            <!-- Sorting header row -->
            <tr>
                <th v-for="(value, key) in rows[0]"
                    :key="key"
                    @click="sortColumn(key)"
                    style="cursor: pointer;">
                    {{ key }}
                    <span v-if="sortKey === key">
                        {{ sortOrder === 'asc' ? '▲' : '▼' }}
                    </span>
                </th>
            </tr>
        </thead>

        <tbody>
            <tr v-for="(row, index) in filteredAndSortedRows" :key="row.id ?? index">
                <td v-for="(value, key) in row" :key="key">
                    <span v-html="formatData(key, row)"></span>
                </td>
            </tr>
        </tbody>
    </table>

    <p v-else>No data available.</p>
</div>

<script>
const app = Vue.createApp({
    data() {
        return {
            rows: [],
            sortKey: null,
            sortOrder: 'asc',
            filters: {},
            // mapping of column -> URL template
            data_links: {
                id_order: '{$adminUrl}/index.php/sell/orders/{id_order}/view?token={$token}&_token={$_token}',
                id_product: '{$adminUrl}/index.php/sell/catalog/products/{id_product}?token={$token}&_token={$_token}',
                id_customer: '{$adminUrl}/index.php/sell/customers/{id_customer}/view?token={$token}&_token={$_token}'
            }
        };
    },
    mounted() {
        this.fetchrows();
    },
    computed: {
        filteredAndSortedRows() {
            let filtered = this.rows.filter(row => {
                for (const [key, filterValue] of Object.entries(this.filters)) {
                    if (!filterValue) continue;
                    const cell = row[key];
                    if (cell == null) return false;
                    const cellStr = String(cell).toLowerCase();
                    const filterStr = String(filterValue).toLowerCase();
                    if (!cellStr.includes(filterStr)) return false;
                }
                return true;
            });

            if (!this.sortKey) return filtered;

            const key = this.sortKey;
            const order = this.sortOrder === 'asc' ? 1 : -1;

            return [...filtered].sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (valA == null && valB == null) return 0;
                if (valA == null) return 1 * order;
                if (valB == null) return -1 * order;

                const numA = parseFloat(valA);
                const numB = parseFloat(valB);

                if (!isNaN(numA) && !isNaN(numB)) {
                    if (numA < numB) return -1 * order;
                    if (numA > numB) return 1 * order;
                    return 0;
                }

                valA = String(valA).toLowerCase();
                valB = String(valB).toLowerCase();

                if (valA < valB) return -1 * order;
                if (valA > valB) return 1 * order;
                return 0;
            });
        }
    },
    methods: {
        fetchrows() {
            fetch('{$fullUrl}&output_format=json')
                .then(response => response.json())
                .then(data => {
                    this.rows = data;
                })
                .catch(err => {
                    console.error('Error fetching data:', err);
                });
        },

        sortColumn(key) {
            if (this.sortKey === key) {
                this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                this.sortKey = key;
                this.sortOrder = 'asc';
            }
        },

        /*
        formatData(column_name, row) { 
            if (column_name == 'name-link') {
                return `<a href="{$scriptUrl}?id=${row['id']}">${row['name-link']}</a>`;
            } else if (column_name.startsWith('link-')) {
                return `<a href="${row[column_name]}" target="_blank">${column_name.replace('link-', '')}</a>`;
            } else {
                return row[column_name];
            }
        }
        */
        // Build URL from data_links template by replacing {field} with row[field]
        makeDataLink(column_name, row) {
            const template = this.data_links[column_name];
            if (!template) return null;

            return template.replace(/{([^}]+)}/g, (match, fieldName) => {
                const val = row[fieldName];
                return val != null ? encodeURIComponent(val) : '';
            });
        },
        formatData(column_name, row) {
            // 1) Columns defined in data_links
            if (this.data_links[column_name]) {
                const url = this.makeDataLink(column_name, row);
                const label = row[column_name] ?? '';
                if (!url) return label;
                // stopPropagation to avoid any parent click handlers
                return `<a href="${url}" target="_blank" onclick="event.stopPropagation()">${label}</a>`;
            }

            // 2) existing special column for product view
            if (column_name === 'name-link') {
                return `<a href="{$scriptUrl}?id=${row['id']}&token={$token}&_token={$_token}" target="_blank" onclick="event.stopPropagation()">${row['name-link']}</a>`;
            }

            // 3) existing 'link-*' columns
            if (column_name.startsWith('link-')) {
                const label = column_name.replace('link-', '');
                const url = row[column_name];
                if (!url) return '';
                return `<a href="${url}" target="_blank" onclick="event.stopPropagation()">${label}</a>`;
            }

            // 4) default – just return the plain value
            return row[column_name];
        }
    }
});

app.mount('#app');
</script>

</body>
</html>
